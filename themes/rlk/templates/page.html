{% extends "base.html" %}

{# Fallback for any page that does not set Template: in its metadata. #}

{% block title %}{{ page.title }} — {{ SITENAME }}{% endblock %}

{% block content %}
<article class="station">
  <header class="station__head">
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="station__subtitle">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ page.content }}
  </div>
</article>
{% endblock %}
